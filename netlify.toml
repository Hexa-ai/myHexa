[build]
  base = "app"
  command = "pnpm install --frozen-lockfile && pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--version"
  # adresse affichée dans la fiche box (à saisir dans la box) : notre domaine, relais vers device-ingress
  VITE_DEVICE_API_URL = "https://api.hexa-ai.fr"

# ── API des box sous notre domaine : https://api.hexa-ai.fr (alias du site Netlify, CNAME vers myhexa.netlify.app)
# Netlify relaie vers l'Edge Function device-ingress (jeton Bearer et corps transmis tels quels, réponse
# renvoyée à la box). Adresse à saisir dans la box : https://api.hexa-ai.fr
# Les règles doivent rester AVANT la règle « /* » de l'application.
[[redirects]]
  from = "https://api.hexa-ai.fr/ingress/*"
  to = "https://mlbezfyjbnjyogogqmem.supabase.co/functions/v1/device-ingress/ingress/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://api.hexa-ai.fr/provision/*"
  to = "https://mlbezfyjbnjyogogqmem.supabase.co/functions/v1/device-ingress/provision/:splat"
  status = 200
  force = true

# tout le reste sur api.hexa-ai.fr (dont l'ancien chemin /<hostname>/status des box à jeton manuel) :
# relayé aussi, device-ingress répond 404 / 405 lui-même. Jamais l'application sur ce domaine.
[[redirects]]
  from = "https://api.hexa-ai.fr/*"
  to = "https://mlbezfyjbnjyogogqmem.supabase.co/functions/v1/device-ingress/:splat"
  status = 200
  force = true

# même relais sous my.hexa-ai.fr/api/device-ingress : essais avant la mise en place du DNS
[[redirects]]
  from = "/api/device-ingress/*"
  to = "https://mlbezfyjbnjyogogqmem.supabase.co/functions/v1/device-ingress/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# PWA : le service worker et le manifeste ne doivent jamais rester en cache (mise à jour à chaque mise en prod)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"
