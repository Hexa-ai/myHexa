name: CI

# Vérifications automatiques à chaque push / pull request sur master.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  app:
    name: Portail (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm exec eslint .

      - name: Unit tests
        run: pnpm test:unit

      # Valeurs factices : le build vérifie seulement que l'app compile (aucun secret nécessaire).
      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_EDGE_FUNCTIONS_URL: https://example.supabase.co/functions/v1

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.x

      - name: Typecheck
        run: deno check */index.ts

      - name: Tests
        run: deno test --allow-env --allow-net=none
